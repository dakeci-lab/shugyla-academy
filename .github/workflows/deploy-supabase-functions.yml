name: Deploy Supabase Edge Functions

# Edge Functions are NOT deployed by the frontend workflow (deploy-ps-production.yml) — this one
# is run by hand (Actions → «Deploy Supabase Edge Functions» → Run workflow) after merging a change
# under supabase/functions/. Needs the repository secret SUPABASE_ACCESS_TOKEN (a Supabase personal
# access token: https://supabase.com/dashboard/account/tokens). No Docker needed (--use-api).

on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Space-separated function names, or "all"'
        required: true
        default: 'umag-sync'

permissions:
  contents: read

concurrency:
  group: supabase-functions-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: cxadzerxndlscwvdaymk

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REQUESTED: ${{ inputs.functions }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi
          if [ "${REQUESTED}" = "all" ]; then
            NAMES=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_shared' -exec basename {} \; | sort)
          else
            NAMES="${REQUESTED}"
          fi
          for name in ${NAMES}; do
            if [ ! -f "supabase/functions/${name}/index.ts" ]; then
              echo "::error::Unknown function: ${name}"
              exit 1
            fi
            echo "=== Deploying ${name}"
            supabase functions deploy "${name}" --project-ref "${PROJECT_REF}" --use-api
          done
