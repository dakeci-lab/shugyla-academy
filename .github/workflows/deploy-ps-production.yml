name: Build PS.kz production artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps-production-artifact
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify dual-domain deployment
        run: npm run verify:domain-deployment

      - name: Resolve VAPID public key
        id: vapid
        run: |
          if [ -f config/production-vapid-public.key ]; then
            KEY="$(tr -d '\n' < config/production-vapid-public.key)"
            echo "public_key=$KEY" >> "$GITHUB_OUTPUT"
          else
            echo "public_key=" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve production Web Push E2E test flag
        id: web_push_e2e
        run: |
          if [ -f config/production-web-push-e2e-test.flag ] && [ "$(tr -d '[:space:]' < config/production-web-push-e2e-test.flag)" = "enabled" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build root-domain artifact
        run: npm run build
        env:
          APP_BASE_PATH: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB_PUSH_VAPID_PUBLIC_KEY: ${{ steps.vapid.outputs.public_key }}
          VITE_WEB_PUSH_PRODUCTION_E2E_TEST: ${{ steps.web_push_e2e.outputs.enabled == 'true' && 'true' || '' }}

      - name: Verify production artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.htaccess
          test -f dist/manifest.webmanifest
          test -f dist/pwa-icons/icon-192.png
          test -f dist/pwa-icons/icon-512.png
          test -f dist/sw.js
          test -f dist/version.json
          grep -q '"base": "/"' dist/version.json

      - name: Publish artifact branch for Plesk
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b ps-production
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin ps-production
