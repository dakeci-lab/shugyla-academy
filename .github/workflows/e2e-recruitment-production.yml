name: E2E Recruitment (production smoke, manual)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production platform base URL
        required: true
        default: https://web.shugyla-market.kz
      careers_base_url:
        description: Production careers base URL
        required: true
        default: https://jobs.shugyla-market.kz
      root_base_url:
        description: Production corporate base URL
        required: true
        default: https://shugyla-market.kz

permissions:
  contents: read

concurrency:
  group: e2e-recruitment-production-smoke
  cancel-in-progress: false

jobs:
  e2e-recruitment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify recruitment surfaces
        run: |
          npm run verify:domain-deployment
          npm run verify:public-route-isolation
          npm run verify:recruitment-vacancy-public-fields

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run non-destructive production smoke
        env:
          E2E_SUITE: smoke
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_CAREERS_BASE_URL: ${{ inputs.careers_base_url }}
          E2E_ROOT_BASE_URL: ${{ inputs.root_base_url }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:e2e:recruitment:smoke

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruitment-e2e-smoke-artifacts
          path: |
            test-results/e2e-recruitment/
            playwright-report/recruitment/
          if-no-files-found: ignore
