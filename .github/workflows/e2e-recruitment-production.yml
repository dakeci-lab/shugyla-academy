name: E2E Recruitment (production, manual)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production app base URL
        required: true
        default: https://dakeci-lab.github.io/shugyla-academy

permissions:
  contents: read

concurrency:
  group: e2e-recruitment-production
  cancel-in-progress: false

jobs:
  e2e-recruitment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run recruitment E2E against production
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional durable account (skip temp user creation):
          # E2E_REUSE_HR: '1'
          # E2E_HR_LOGIN: ${{ secrets.E2E_HR_LOGIN }}
          # E2E_HR_PASSWORD: ${{ secrets.E2E_HR_PASSWORD }}
        run: npm run test:e2e:recruitment

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruitment-e2e-artifacts
          path: |
            test-results/e2e-recruitment/
            playwright-report/recruitment/
          if-no-files-found: ignore
